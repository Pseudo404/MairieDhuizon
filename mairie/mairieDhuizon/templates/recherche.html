{% extends 'index.html' %}
{% block content %}
<div class="max-w-6xl mx-auto py-10 px-4">
    <h1 class="text-3xl font-bold mb-6">
        Résultats pour "{{ q }}"
    </h1>
    {% for r in resultats %}
        <a href="{{ r.url }}"
           class="block bg-white rounded-xl shadow p-4 mb-4 hover:shadow-lg">
            <span class="text-sm text-green-700 font-bold">{{ r.type }}</span>
            <h2 class="text-xl font-bold">{{ r.titre }}</h2>
            <p class="text-gray-600">{{ r.description }}</p>
        </a>
    {% empty %}
        <p>Aucun résultat trouvé.</p>
    {% endfor %}
</div>
{% endblock %}
