{% extends 'app_mobile/base_app.html' %}

{% block content %}
<div class="safe-top bg-white px-5 py-6 shadow-sm mb-4">
    <h1 class="text-2xl font-bold text-gray-900">Signaler un problème</h1>
    <p class="text-gray-500 mt-1 text-sm">Voirie, éclairage, déchets...</p>
</div>

<form method="post" enctype="multipart/form-data" class="px-5 pb-8" id="signalement-form">
    {% csrf_token %}
    
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Que se passe-t-il ? *</label>
        <select name="categorie" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 mb-4 focus:ring-2 focus:ring-green-500 outline-none">
            <option value="">Choisir une catégorie...</option>
            {% for val, label in categories %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
        </select>

        <textarea name="description" required rows="3" placeholder="Décrivez le problème..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:ring-2 focus:ring-green-500 outline-none"></textarea>
    </div>

    <!-- Appareil photo -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4 text-center">
        <label class="block text-sm font-semibold text-gray-700 mb-3 text-left">Photo (optionnelle mais recommandée)</label>
        
        <div class="relative w-full h-32 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center overflow-hidden" id="photo-preview-container">
            <span class="text-4xl mb-2">📸</span>
            <span class="text-sm text-gray-500 font-medium">Prendre une photo</span>
            
            <input type="file" name="photos" accept="image/*" capture="environment" id="photo-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <img id="photo-preview" class="absolute inset-0 w-full h-full object-cover hidden">
        </div>
    </div>

    <!-- GPS -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-3">Où est-ce ? *</label>
        
        <input type="hidden" name="latitude" id="lat-input">
        <input type="hidden" name="longitude" id="lng-input">
        
        <button type="button" id="btn-gps" class="w-full bg-blue-50 text-blue-700 font-semibold rounded-xl py-3 flex items-center justify-center gap-2 mb-3 active:bg-blue-100 transition-colors">
            <span>📍</span> Utiliser ma position actuelle
        </button>
        <p id="gps-status" class="text-xs text-center text-gray-500 hidden mb-3"></p>

        <div class="flex items-center gap-2 text-gray-400 text-sm mb-3">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span>ou</span>
            <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <input type="text" name="adresse_approximative" id="adresse-input" placeholder="Tapez l'adresse ou le lieu..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:ring-2 focus:ring-green-500 outline-none">
    </div>

    <!-- Contact -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Votre email (optionnel)</label>
        <p class="text-xs text-gray-500 mb-3">Pour être tenu au courant de la résolution.</p>
        <input type="email" name="email_signalant" placeholder="vous@email.com" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:ring-2 focus:ring-green-500 outline-none">
    </div>

    <button type="submit" id="btn-submit" class="w-full bg-green-600 text-white font-bold text-lg rounded-xl py-4 shadow-lg active:bg-green-700 transition-colors">
        Envoyer le signalement
    </button>
</form>

<script>
    // Preview photo
    document.getElementById('photo-input').addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('photo-preview').src = e.target.result;
                document.getElementById('photo-preview').classList.remove('hidden');
            }
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    // Geolocation
    document.getElementById('btn-gps').addEventListener('click', function() {
        const status = document.getElementById('gps-status');
        const latInput = document.getElementById('lat-input');
        const lngInput = document.getElementById('lng-input');
        
        if (!navigator.geolocation) {
            status.textContent = 'La géolocalisation n\'est pas supportée par votre navigateur.';
            status.classList.remove('hidden');
            status.classList.add('text-red-500');
            return;
        }

        status.textContent = 'Localisation en cours...';
        status.classList.remove('hidden', 'text-red-500', 'text-green-600');
        
        navigator.geolocation.getCurrentPosition(
            (position) => {
                latInput.value = position.coords.latitude;
                lngInput.value = position.coords.longitude;
                status.textContent = '✅ Position trouvée avec succès !';
                status.classList.add('text-green-600');
                
                // On vide le champ adresse manuel si le GPS est utilisé
                document.getElementById('adresse-input').value = 'Position GPS utilisée';
                document.getElementById('adresse-input').readOnly = true;
                document.getElementById('adresse-input').classList.add('bg-gray-100', 'text-gray-500');
            },
            (error) => {
                status.textContent = 'Erreur : Impossible de vous localiser. Veuillez taper l\'adresse manuellement.';
                status.classList.add('text-red-500');
            },
            { enableHighAccuracy: true }
        );
    });

    // Validation
    document.getElementById('signalement-form').addEventListener('submit', function(e) {
        const lat = document.getElementById('lat-input').value;
        const adresse = document.getElementById('adresse-input').value;
        
        if (!lat && !adresse) {
            e.preventDefault();
            alert("Veuillez soit utiliser le GPS, soit taper l'adresse du problème.");
        } else {
            document.getElementById('btn-submit').textContent = 'Envoi en cours...';
            document.getElementById('btn-submit').classList.add('opacity-70', 'cursor-not-allowed');
        }
    });
</script>
{% endblock %}
