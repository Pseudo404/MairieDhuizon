{% extends 'app_mobile/base_app.html' %}
{% load static %}

{% block title %}<title>{{ alerte.title }}</title>{% endblock %}

{% block content %}
<!-- Top Header with Back Button -->
<div class="safe-top bg-white px-4 py-4 shadow-sm flex items-center gap-4 sticky top-0 z-50">
    <button onclick="history.back()" class="p-2 rounded-full bg-gray-100 text-gray-700 active:bg-gray-200 transition-colors flex items-center justify-center">
        <span class="text-2xl leading-none">&larr;</span>
    </button>
    <h1 class="text-xl font-bold text-gray-900 truncate flex-1">Actualité</h1>
</div>

<div class="px-5 pb-12 pt-6">
    <p class="text-sm text-gray-500 font-semibold mb-2">{{ alerte.created_at|date:"d F Y - H:i" }}</p>
    <h2 class="text-2xl font-bold text-gray-900 mb-6">{{ alerte.title }}</h2>
    
    {% if alerte.image %}
    <div class="rounded-2xl overflow-hidden mb-6 shadow-sm">
        <img src="{{ alerte.image.url }}" alt="{{ alerte.title }}" class="w-full h-auto object-cover">
    </div>
    {% endif %}
    
    <div class="text-gray-800 text-base leading-relaxed prose prose-green max-w-none">
        {{ alerte.content|safe|linebreaks }}
    </div>
</div>
{% endblock %}
