<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0f172a;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
        }

        .container{
            text-align:center;
            max-width:700px;
            padding:40px;
        }

        .code{
            font-size:120px;
            font-weight:bold;
            color:#38bdf8;
            text-shadow:0 0 25px rgba(56,189,248,0.5);
        }

        h1{
            font-size:38px;
            margin-top:10px;
            margin-bottom:20px;
        }

        p{
            color:#cbd5e1;
            line-height:1.7;
            font-size:18px;
            margin-bottom:30px;
        }

        a{
            display:inline-block;
            padding:14px 28px;
            background:#38bdf8;
            color:#0f172a;
            text-decoration:none;
            border-radius:10px;
            font-weight:bold;
            transition:0.3s;
        }

        a:hover{
            background:#0ea5e9;
            transform:translateY(-2px);
        }

        .glow{
            position:absolute;
            width:400px;
            height:400px;
            background:#38bdf8;
            opacity:0.15;
            filter:blur(120px);
            border-radius:50%;
            z-index:-1;
        }

        .glow.top{
            top:-100px;
            left:-100px;
        }

        .glow.bottom{
            bottom:-100px;
            right:-100px;
        }
    </style>
</head>
<body>

    <div class="glow top"></div>
    <div class="glow bottom"></div>

    <div class="container">
        <div class="code">500</div>

        <h1>Erreur interne du serveur</h1>

        <p>
            Une erreur inattendue est survenue sur le serveur.
            Nos services techniques ont été informés automatiquement.
        </p>

        <a href="/">Retour à l'accueil</a>
    </div>

</body>
</html>
