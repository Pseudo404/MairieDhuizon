{% if status == 'Ouvert' %}
<span class="inline-flex items-center gap-2 rounded-full bg-emerald-100 text-emerald-800 px-4 py-1.5 text-sm font-bold ring-1 ring-emerald-200">
    <span class="relative flex h-2.5 w-2.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-500 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-600"></span>
    </span>
    Ouvert maintenant
</span>
{% elif status == 'Fermé' or status == "Fermé aujourd'hui" %}
<span class="inline-flex items-center gap-2 rounded-full bg-red-100 text-red-800 px-4 py-1.5 text-sm font-bold ring-1 ring-red-200">
    <span class="h-2.5 w-2.5 rounded-full bg-red-600"></span>
    Fermé
</span>
{% else %}
<span class="inline-flex items-center gap-2 rounded-full bg-amber-100 text-amber-900 px-4 py-1.5 text-sm font-semibold ring-1 ring-amber-200">
    <span class="h-2.5 w-2.5 rounded-full bg-amber-500"></span>
    {{ status }}
</span>
{% endif %}
