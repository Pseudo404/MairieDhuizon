{# Thème partagé du panneau de contrôle — aligné sur la charte Mairie (vert) #}
<style>
.panel-bg {
    background: linear-gradient(160deg, #f0fdf4 0%, #ffffff 45%, #ecfdf5 100%);
    min-height: 100vh;
}
.panel-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 1.25rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    transition: all .35s cubic-bezier(.4,0,.2,1);
}
.panel-card:hover {
    border-color: #86efac;
    box-shadow: 0 12px 40px rgba(21,128,61,.12);
    transform: translateY(-4px);
}
.panel-card-accent::before {
    content: '';
    position: absolute;
    inset-inline: 0;
    top: 0;
    height: 4px;
    border-radius: 1.25rem 1.25rem 0 0;
    background: linear-gradient(90deg, #16a34a, #22c55e);
    opacity: .85;
    transition: opacity .3s;
}
.panel-card:hover .panel-card-accent::before { opacity: 1; }
.panel-card-amber::before { background: linear-gradient(90deg, #d97706, #f59e0b); }

.panel-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    font-weight: 600;
    border-radius: .875rem;
    transition: all .25s cubic-bezier(.4,0,.2,1);
}
.panel-btn-primary {
    background: linear-gradient(135deg, #15803d, #16a34a);
    color: #fff;
    padding: .75rem 1.5rem;
    box-shadow: 0 4px 14px rgba(21,128,61,.25);
}
.panel-btn-primary:hover {
    background: linear-gradient(135deg, #166534, #15803d);
    box-shadow: 0 8px 24px rgba(21,128,61,.35);
    transform: translateY(-2px);
}
.panel-btn-primary:active { transform: translateY(0); }

.panel-btn-secondary {
    background: #fff;
    color: #374151;
    border: 1px solid #d1d5db;
    padding: .75rem 1.5rem;
}
.panel-btn-secondary:hover {
    background: #f9fafb;
    border-color: #86efac;
    color: #15803d;
    transform: translateY(-1px);
}

.panel-btn-danger {
    background: linear-gradient(135deg, #dc2626, #ef4444);
    color: #fff;
    padding: .75rem 1.5rem;
    box-shadow: 0 4px 14px rgba(220,38,38,.2);
}
.panel-btn-danger:hover {
    background: linear-gradient(135deg, #b91c1c, #dc2626);
    box-shadow: 0 8px 24px rgba(220,38,38,.3);
    transform: translateY(-2px);
}

.panel-btn-ghost {
    color: #6b7280;
    padding: .5rem 1rem;
    font-size: .875rem;
    font-weight: 500;
}
.panel-btn-ghost:hover {
    color: #15803d;
    background: #f0fdf4;
}

.panel-btn-sm {
    padding: .375rem .875rem;
    font-size: .75rem;
    border-radius: .625rem;
}
.panel-btn-edit {
    background: #eff6ff;
    color: #2563eb;
    border: 1px solid #bfdbfe;
}
.panel-btn-edit:hover {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
    transform: scale(1.05);
}
.panel-btn-delete {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
}
.panel-btn-delete:hover {
    background: #dc2626;
    color: #fff;
    border-color: #dc2626;
    transform: scale(1.05);
}
.panel-btn-toggle-pub {
    background: #f0fdf4;
    color: #15803d;
    border: 1px solid #bbf7d0;
}
.panel-btn-toggle-pub:hover {
    background: #15803d;
    color: #fff;
    transform: scale(1.05);
}
.panel-btn-toggle-unpub {
    background: #fffbeb;
    color: #d97706;
    border: 1px solid #fde68a;
}
.panel-btn-toggle-unpub:hover {
    background: #d97706;
    color: #fff;
    transform: scale(1.05);
}

.panel-back {
    color: #6b7280;
    font-size: .875rem;
    transition: all .2s;
}
.panel-back:hover {
    color: #15803d;
    transform: translateX(-3px);
}

.panel-table-wrap {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 1.25rem;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.panel-table thead { background: #f9fafb; }
.panel-table tbody tr {
    border-bottom: 1px solid #f3f4f6;
    transition: background .2s;
}
.panel-table tbody tr:hover { background: #f0fdf4; }

.panel-form-box {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 1.25rem;
    padding: 2rem;
    box-shadow: 0 4px 20px rgba(0,0,0,.04);
}

.panel-title {
    background: linear-gradient(135deg, #15803d, #059669);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.panel-badge {
    display: inline-flex;
    align-items: center;
    gap: .375rem;
    padding: .25rem .75rem;
    border-radius: 9999px;
    font-size: .75rem;
    font-weight: 600;
}
.panel-badge-green { background: #dcfce7; color: #15803d; }
.panel-badge-gray  { background: #f3f4f6; color: #6b7280; }
.panel-badge-amber { background: #fef3c7; color: #b45309; }

.panel-msg-success {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #15803d;
    border-radius: .875rem;
    padding: .875rem 1.25rem;
}
.panel-msg-error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    border-radius: .875rem;
    padding: .875rem 1.25rem;
}

.panel-empty {
    background: #fff;
    border: 2px dashed #d1d5db;
    border-radius: 1.25rem;
    transition: border-color .3s;
}
.panel-empty:hover { border-color: #86efac; }

.panel-logout {
    background: #fff;
    color: #dc2626;
    border: 1px solid #fecaca;
    padding: .625rem 1.25rem;
    border-radius: .875rem;
    font-weight: 600;
    transition: all .25s;
}
.panel-logout:hover {
    background: #dc2626;
    color: #fff;
    border-color: #dc2626;
    box-shadow: 0 6px 20px rgba(220,38,38,.25);
    transform: translateY(-2px);
}

.panel-icon-wrap {
    width: 4.5rem;
    height: 4.5rem;
    border-radius: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    margin: 0 auto 1.25rem;
    transition: transform .35s cubic-bezier(.4,0,.2,1);
}
.group:hover .panel-icon-wrap { transform: scale(1.1) rotate(-3deg); }
.panel-icon-green { background: #dcfce7; }
.panel-icon-amber { background: #fef3c7; }

/* Champs de formulaire */
.panel-bg input[type="text"],
.panel-bg input[type="email"],
.panel-bg input[type="url"],
.panel-bg input[type="number"],
.panel-bg input[type="date"],
.panel-bg input[type="time"],
.panel-bg input[type="tel"],
.panel-bg input[type="file"],
.panel-bg textarea,
.panel-bg select {
    width: 100%;
    padding: .75rem 1rem;
    border: 1px solid #d1d5db;
    border-radius: .75rem;
    background: #fff;
    color: #111827;
    font-size: .9375rem;
    transition: border-color .2s, box-shadow .2s;
}
.panel-bg input:focus,
.panel-bg textarea:focus,
.panel-bg select:focus {
    outline: none;
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,.15);
}
.panel-bg input[type="checkbox"] {
    width: 1.125rem;
    height: 1.125rem;
    accent-color: #16a34a;
    cursor: pointer;
}
.panel-bg label { color: #374151; }
.panel-field-label {
    display: block;
    font-size: .875rem;
    font-weight: 600;
    color: #374151;
    margin-bottom: .5rem;
}
.panel-field-error { color: #dc2626; font-size: .875rem; margin-top: .25rem; }

/* Style the file input button */
.panel-bg input[type="file"] {
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    box-shadow: none;
}
.panel-bg input[type="file"]::file-selector-button {
    background: linear-gradient(135deg, #15803d, #16a34a);
    color: white;
    padding: .75rem 1.5rem;
    border: none;
    border-radius: .75rem;
    font-weight: 600;
    cursor: pointer;
    margin-right: 1rem;
    transition: all .25s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 4px 14px rgba(21,128,61,.25);
}
.panel-bg input[type="file"]::file-selector-button:hover {
    background: linear-gradient(135deg, #166534, #15803d);
    box-shadow: 0 8px 24px rgba(21,128,61,.35);
    transform: translateY(-2px);
}

/* Custom styles for publish/unpublish buttons */
.btn-publish {
    background-color: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #dbeafe;
}
.btn-publish:hover {
    background-color: #dbeafe;
}
.btn-unpublish {
    background-color: #fff7ed;
    color: #c2410c;
    border: 1px solid #ffedd5;
}
.btn-unpublish:hover {
    background-color: #ffedd5;
}
</style>
